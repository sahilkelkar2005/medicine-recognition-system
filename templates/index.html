<!DOCTYPE html>
<html>
<head>
<title>Medical Recognition</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #eef2f3, #dfe9f3);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
}

h1 {
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    width: 380px;
    text-align: center;
}

button {
    background: #28a745;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #218838;
}

.preview img {
    max-width: 100%;
    border-radius: 10px;
    margin-top: 10px;
}

.result-card {
    margin-top: 30px;
    width: 420px;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.success {
    color: green;
    font-weight: bold;
}

.fail {
    color: red;
    font-weight: bold;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.box {
    background: #f4f4f4;
    padding: 10px;
    border-radius: 8px;
}

.raw {
    margin-top: 15px;
    font-size: 13px;
    background: #f9f9f9;
    padding: 10px;
    border-radius: 8px;
    max-height: 120px;
    overflow-y: auto;
}
</style>

</head>

<body>

<h1>🩺 Medical Image Recognition</h1>

<div class="card">
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" onchange="previewImage(event)">
        <br><br>
        <button>Analyze Image</button>
    </form>

    <div class="preview">
        <img id="preview" style="display:none;">
    </div>
</div>

{% if raw_text %}

<div class="result-card">

    {% if detected %}
        <div class="success">✅ Medicine Detected</div>

        <div class="grid">
            <div class="box"><b>Name:</b><br>{{ name }}</div>
            <div class="box"><b>Strength:</b><br>{{ strength }}</div>
            <div class="box"><b>Type:</b><br>{{ mtype }}</div>
        </div>

    {% else %}
        <div class="fail">❌ Not a Medicine</div>
    {% endif %}

    <div class="raw">
        <b>Extracted Text:</b><br>
        {{ raw_text }}
    </div>

</div>

{% endif %}

<script>
function previewImage(event) {
    const preview = document.getElementById('preview');
    preview.src = URL.createObjectURL(event.target.files[0]);
    preview.style.display = 'block';
}
</script>

</body>
</html>
